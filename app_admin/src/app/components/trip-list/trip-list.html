<section>
  <div class="page-heading d-flex justify-content-between align-items-center gap-3 mb-4">
    <div>
      <p class="eyebrow mb-1">Inventory</p>
      <h1 class="mb-1">Trips</h1>
      <p class="text-secondary mb-0">Manage the getaways available to Travlr customers.</p>
    </div>
    <a class="btn btn-warning" routerLink="/add-trip">Add Trip</a>
  </div>

  @if (loading) {
    <div class="alert alert-info">Loading trips...</div>
  } @else if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  } @else if (trips.length === 0) {
    <div class="alert alert-secondary">No trips are currently available.</div>
  } @else {
    <div class="row g-4">
      @for (trip of trips; track trip.code) {
        <div class="col-12 col-md-6 col-xl-4">
          <app-trip-card [trip]="trip" (remove)="deleteTrip($event)" />
        </div>
      }
    </div>
  }
</section>
