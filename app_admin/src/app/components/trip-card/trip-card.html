<article class="card trip-card h-100">
  <img [src]="imageUrl" class="card-img-top" [alt]="trip.name" />
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
      <h2 class="card-title h4 mb-0">{{ trip.name }}</h2>
      <span class="trip-code">{{ trip.code }}</span>
    </div>
    <p class="resort mb-3">{{ trip.resort }}</p>
    <dl class="row trip-facts mb-3">
      <dt class="col-5">Length</dt><dd class="col-7">{{ trip.length }}</dd>
      <dt class="col-5">Starts</dt><dd class="col-7">{{ trip.start | date: 'MMM d, y': 'UTC' }}</dd>
      <dt class="col-5">Per person</dt><dd class="col-7 price">{{ trip.perPerson }}</dd>
    </dl>
    <p class="card-text flex-grow-1">{{ trip.description }}</p>
    @if (canEdit) {
      <div class="d-flex gap-2 mt-3">
        <a class="btn btn-primary flex-grow-1" [routerLink]="['/edit-trip', trip.code]">Edit trip</a>
        <button class="btn btn-outline-danger" type="button" (click)="remove.emit(trip.code)">Delete</button>
      </div>
    }
  </div>
</article>
